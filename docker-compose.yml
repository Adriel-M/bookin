services:
  bookin:
    image: ghcr.io/adriel-m/bookin:latest
    pull_policy: always
    container_name: bookin
    restart: unless-stopped
    volumes:
      - ./input:/input          # drop ebooks here to be processed
      - ./output:/output        # organized output appears here
    environment:
      - TZ=America/New_York
      # Hardcover API token (from https://hardcover.app/account/api). Required
      # for metadata enrichment; without it books are organized using embedded
      # metadata only. Keep it in a .env file, not committed.
      - BOOKIN_HARDCOVER_TOKEN=${BOOKIN_HARDCOVER_TOKEN}
      # - BOOKIN_TEMPLATE={authors}/{title}
      # - BOOKIN_LOG_LEVEL=INFO
