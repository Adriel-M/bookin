[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookin"
version = "0.1.0"
description = "Ebook folder watcher and organizer using Calibre"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=4.0",
    "click>=8.1",
    "rich>=13.0",
    # httpx and pydantic are what the generated Hardcover client runs on.
    "httpx>=0.28",
    "pydantic>=2.0",
    "pyjarowinkler>=3.0",
]

[project.scripts]
bookin = "bookin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bookin"]

[tool.ruff]
line-length = 100
target-version = "py311"
# ariadne-codegen formats its own output; linting or reformatting it here would
# fight the generator and break the `make codegen` diff check in CI.
extend-exclude = ["src/bookin/graphql_client"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["bookin"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "watchdog.*"
ignore_missing_imports = true

# pyjarowinkler ships no py.typed marker.
[[tool.mypy.overrides]]
module = "pyjarowinkler.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Generates src/bookin/graphql_client from the vendored schema. Run via
# `make codegen` (which uses uvx, keeping ariadne-codegen's pinned ruff out of
# this project's dev environment).
[tool.ariadne-codegen]
schema_path = "vendor/hardcover-docs/schema.graphql"
queries_path = "queries"
target_package_name = "graphql_client"
target_package_path = "src/bookin"
client_name = "HardcoverClient"
# The processor runs on a plain worker thread, so a sync client fits.
async_client = false
# Hardcover's schema is Hasura-generated and enormous; only emit what the
# operations in queries/ actually reference.
include_all_inputs = false
include_all_enums = false

# Hasura's custom scalars. Unmapped scalars generate as `typing.Any`, so every
# one our queries touch is mapped here to keep the client free of `Any`.
[tool.ariadne-codegen.scalars.date]
type = "str"

[tool.ariadne-codegen.scalars.float8]
type = "float"

[tool.ariadne-codegen.scalars.numeric]
type = "float"

[tool.ariadne-codegen.scalars.bigint]
type = "int"
